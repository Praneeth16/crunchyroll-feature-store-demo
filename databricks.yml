# Crunchyroll Feature Store on Lakebase -- one bundle, one deploy.
#
# What this bundle owns: jobs and their DAG, the checkpoint volume, the model
# shells, the dashboard, and the app plus its permission grants.
#
# What it deliberately does NOT own:
#   * the online store itself -- there is no DAB resource for it, and
#     fe.create_online_store (notebook 01) must own the Lakebase project so the
#     feature store's serving metadata resolves.
#   * postgres_projects -- declaring the project the feature store owns produces
#     permanent field drift, and `bundle destroy` could delete the online store
#     out from under the published tables. Endpoint sizing is done with
#     `databricks postgres update-endpoint` from scripts/preflight.sh instead.
#   * the published online tables -- do NOT create these with
#     postgres_synced_tables. A raw synced table is not registered as a
#     feature-store online table, so automatic feature lookup will not resolve it
#     at serving time. fe.publish_table owns them.
#   * feature specs and feature serving endpoints -- no DAB resource key exists.
bundle:
  name: crunchyroll-feature-store

include:
  - resources/*.yml

# The app's built frontend is gitignored (dist/) but must reach the app. `make frontend`
# builds it on the laptop; this ships it. See app/frontend/vite.config.ts for why the
# build does not happen in the app container.
sync:
  include:
    - app/frontend/dist/**

variables:
  catalog:
    description: >-
      UC catalog holding every demo object. scripts/bootstrap.sh writes the one you pass
      with --catalog (or the first managed catalog it finds) to .crfs.vars.
    default: main
  schema:
    description: UC schema holding every demo object.
    default: crunchyroll_demo
  online_store:
    description: Online Feature Store name. DNS-compliant -- lowercase, hyphens, no underscores.
    default: crunchyroll-online-store
  online_capacity:
    description: Online store capacity class. CU_N gives the Lakebase endpoint a 4N CU floor.
    default: CU_1
  lakebase_project:
    default: crunchyroll-online-store
  lakebase_branch:
    default: production
  lakebase_endpoint:
    default: primary
  lakebase_db_resource:
    description: >-
      Full Lakebase database resource path for the app's postgres resource. The id
      is generated at project creation, so scripts/preflight.sh discovers it --
      never guess this value. The placeholder only lets the first deploy of a fresh
      workspace validate before notebook 01 has created the store.
    default: projects/crunchyroll-online-store/branches/production/databases/resolved-by-bootstrap
  ranker_endpoint:
    default: crunchyroll-watch-next-ranker
  rail_ranker_endpoint:
    description: >-
      Vertical (rail) ranking endpoint. Deliberately separate from
      ranker_endpoint: this one sits in the homepage request path and is
      configured without scale-to-zero, with explicit provisioned
      concurrency and with route optimization.
    default: crunchyroll-rail-ranker
  retriever_endpoint:
    default: crunchyroll-candidate-retriever
  feature_endpoint:
    default: crunchyroll-viewer-features
  agent_endpoint:
    default: crunchyroll-explainer-agent
  llm_endpoint:
    description: Databricks-hosted chat model backing the explainer agent.
    default: databricks-claude-sonnet-4-5
  warehouse_id:
    description: SQL warehouse id. Discovered (or created) by scripts/bootstrap.sh; no default.
  app_name:
    description: Databricks App name. Lowercase and dashes only.
    default: crfs-watch-next
  volume:
    default: crfs_ops
  end_date:
    description: Last day of generated history. Empty means yesterday.
    default: ""
  notification_email:
    description: Job failure notifications. scripts/bootstrap.sh sets it to the deploying user.

targets:
  dev:
    mode: development
    default: true
    # No workspace.host: the host comes from the CLI profile (--profile), so the same
    # bundle deploys to any workspace without an edit.
    #
    # dev and prod deliberately target the SAME schema, online store and
    # endpoints. This is a single-workspace demo: a second schema would mean a
    # second set of published online tables on the same always-on Lakebase store,
    # a second full rebuild, and verification runs that do not exercise what the
    # demo actually shows. `mode: development` still prefixes job and app names
    # with the deployer, which is the isolation that matters here.
    #
    # A customer who wants true isolation overrides `schema` and the four
    # endpoint names per target -- every one of them is already a variable.

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      schema: crunchyroll_demo
    permissions:
      - level: CAN_MANAGE
        user_name: ${workspace.current_user.userName}

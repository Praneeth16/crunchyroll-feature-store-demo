# Streamlit on Databricks Apps.
#
# Every value here is substituted by the bundle at deploy time -- app.py reads
# only environment variables and never hardcodes a name. The `valueFrom` entries
# refer to resource names declared in resources/app.yml.
command:
  - streamlit
  - run
  - app.py
  - --server.port
  - "8000"
  - --server.address
  - "0.0.0.0"

env:
  - name: STREAMLIT_SERVER_ENABLE_CORS
    value: "false"
  - name: STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION
    value: "false"
  - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
    value: "false"

  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: warehouse

  - name: DATABRICKS_CATALOG
    value: "${DATABRICKS_CATALOG}"
  - name: DATABRICKS_SCHEMA
    value: "${DATABRICKS_SCHEMA}"

  - name: RANKER_ENDPOINT
    value: "${RANKER_ENDPOINT}"
  - name: RETRIEVER_ENDPOINT
    value: "${RETRIEVER_ENDPOINT}"
  - name: FEATURE_ENDPOINT
    value: "${FEATURE_ENDPOINT}"
  - name: AGENT_ENDPOINT
    value: "${AGENT_ENDPOINT}"

  - name: ONLINE_STORE
    value: "${ONLINE_STORE}"
  - name: LAKEBASE_PROJECT
    value: "${LAKEBASE_PROJECT}"
  - name: LAKEBASE_BRANCH
    value: "${LAKEBASE_BRANCH}"
  - name: LAKEBASE_ENDPOINT
    value: "${LAKEBASE_ENDPOINT}"

  # The "watch 3 episodes now" button triggers this job.
  - name: BURST_JOB_ID
    value: "${BURST_JOB_ID}"

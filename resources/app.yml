# The watch-next simulator, owned by the bundle.
#
# It used to be deployed by scripts/deploy_app.sh because CLI v1.14.1 could create
# an app but not update one (docs/risks.md 8b). v1.17.0 fixes that: `bundle deploy`
# updates the app's config and `bundle run crfs_watch_next` deploys its source.
# An app that already exists outside the bundle has to be adopted once --
#   databricks bundle deployment bind crfs_watch_next crfs-watch-next
# -- otherwise deploy tries to create it and gets 409 ALREADY_EXISTS.
#
# `config` below carries BOTH the command and the environment, and app/app.yaml is
# gone on purpose. Databricks Apps does not expand `${NAME}` inside app.yaml, so the
# old template had to be rendered into a staging copy before upload; the bundle
# resolves `${var.*}` itself, which removes that whole step and the class of bug
# where an unrendered placeholder reaches the app as a literal string.
#
# The `postgres` resource auto-creates the app service principal's Postgres role but
# NOT its grants on the crunchyroll_demo schema, which is owned by whoever published
# the online tables. Run scripts/grant_app_postgres.sh after deploy, and again after
# any new publish_table.
#
# No notebook-created endpoint is declared as a resource. App creation FAILS OUTRIGHT if it references
# an endpoint that does not exist yet --
#   Error: cannot create resources.apps.crfs_watch_next:
#   Endpoint with name 'crunchyroll-candidate-retriever' does not exist (404)
# -- and every endpoint here is created by a notebook (03, 07, 08, 12, 23), all of which
# run after the first `bundle deploy`. Declaring any of them makes a fresh workspace
# undeployable, so scripts/grant_app_endpoints.sh grants them all after the fact.
resources:
  apps:
    crfs_watch_next:
      name: ${var.app_name}
      description: >-
        Crunchyroll homepage service: both rankers fanned out in one request against
        the Lakebase Online Feature Store, a timeout-budget and circuit-breaker
        fallback, the raw online rows, and a measured freshness loop. FastAPI + React.
      source_code_path: ../app

      # NO notebook-created serving_endpoint resources here, deliberately. App creation validates them,
      # and on an empty workspace `bundle deploy` runs BEFORE the pipeline that creates
      # any endpoint -- so declaring even the ranker makes the first deploy fail with
      #   cannot create resources.apps.crfs_watch_next:
      #   Endpoint with name '...' does not exist (404)
      # which breaks the one-command setup this repo advertises. All four endpoints are
      # granted after the fact by scripts/grant_app_endpoints.sh, which `make deploy-app`
      # and setup.sh both run. The app reads endpoints by name from its environment, so a
      # resource entry buys only the grant, and the script does that.
      resources:
        - name: warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        # The Lakebase database id is GENERATED when fe.create_online_store runs
        # (notebook 01), so on a genuinely empty workspace it does not exist at the time of
        # the first `bundle deploy` and `lakebase_db_resource` still holds the default from
        # databricks.yml -- another workspace's id. Binding it here would either fail
        # validation or bind the wrong database.
        #
        # Sequencing, which scripts/preflight.sh now checks rather than assuming:
        #   make bootstrap   discovers or creates the store and writes the real id
        #   make deploy      binds it, because the var is now correct
        # A fresh workspace that has never run notebook 01 must therefore run `make demo`
        # (or setup.sh, which orders this for you) before the app can reach Postgres. The
        # app degrades to Feature Serving until then and shows a badge saying so.
        - name: postgres
          postgres:
            branch: projects/${var.lakebase_project}/branches/${var.lakebase_branch}
            database: ${var.lakebase_db_resource}
            permission: CAN_CONNECT_AND_CREATE
        # A pay-per-token foundation model endpoint always exists, so declaring it
        # cannot break a fresh deploy the way the notebook-created endpoints would.
        - name: llm
          serving_endpoint:
            name: databricks-claude-haiku-4-5
            permission: CAN_QUERY
        - name: burst_job
          job:
            id: ${resources.jobs.crfs_event_burst.id}
            permission: CAN_MANAGE_RUN

      config:
        # FastAPI serves the API and the React build from one process. The build is
        # made by `make frontend` and shipped by databricks.yml's sync.include; there
        # is deliberately no package.json at app/, so Apps only runs pip.
        command:
          - uvicorn
          - backend.main:app
          - --host
          - "0.0.0.0"
          - --port
          - "8000"
        env:
          # `value_from` (snake_case) in a bundle, even though app.yaml spells the
          # same field `valueFrom`. The bundle warns and IGNORES the camelCase form,
          # which would leave the app with no warehouse id at all.
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: warehouse

          - name: DATABRICKS_CATALOG
            value: ${var.catalog}
          - name: DATABRICKS_SCHEMA
            value: ${var.schema}

          - name: RANKER_ENDPOINT
            value: ${var.ranker_endpoint}
          # The vertical (rail) ranker. Missing from the old app.yaml rendering path
          # for one deploy, which the app survived by falling back to app.py's
          # default -- i.e. the previous workspace's endpoint name.
          - name: RAIL_RANKER_ENDPOINT
            value: ${var.rail_ranker_endpoint}
          - name: RETRIEVER_ENDPOINT
            value: ${var.retriever_endpoint}
          - name: FEATURE_ENDPOINT
            value: ${var.feature_endpoint}
          # "Why?" calls a chat model directly, grounded on the rows the service read.
          - name: LLM_ENDPOINT
            value: databricks-claude-haiku-4-5

          # Request-path budgets. Past these the homepage renders a fallback instead of
          # waiting; see app/backend/fallback.py and docs/open_items.md 5.
          - name: RAIL_TIMEOUT_MS
            value: "300"
          - name: RANKER_TIMEOUT_MS
            value: "400"
          - name: RETRIEVER_TIMEOUT_MS
            value: "400"

          - name: ONLINE_STORE
            value: ${var.online_store}
          - name: LAKEBASE_PROJECT
            value: ${var.lakebase_project}
          - name: LAKEBASE_BRANCH
            value: ${var.lakebase_branch}
          - name: LAKEBASE_ENDPOINT
            value: ${var.lakebase_endpoint}

          # The "watch 3 episodes now" button triggers this job, which appends events
          # and then recomputes and refreshes the TRIGGERED table. Two serverless task
          # starts plus a sync refresh do not fit in the app's old 180s window.
          - name: BURST_JOB_ID
            value: ${resources.jobs.crfs_event_burst.id}
          - name: BURST_WAIT_S
            value: "480"

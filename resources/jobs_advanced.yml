# The advanced track: Feature Views, feature-definition versioning, GPU training.
#
# Separate from resources/jobs.yml on purpose. Everything here stands on a Public
# Preview API, so a workspace where a preview is off should fail to run *these* jobs
# and nothing else. The GA demo (crfs_end_to_end, crfs_vertical) does not depend on
# any of it.
#
# Run crfs_preview_probe first. It answers whether this workspace has the two
# previews, and it is the cheapest possible way to find out.
_common: &common_params
  catalog: ${var.catalog}
  schema: ${var.schema}
  online_store: ${var.online_store}
  online_capacity: ${var.online_capacity}
  lakebase_project: ${var.lakebase_project}
  lakebase_branch: ${var.lakebase_branch}
  lakebase_endpoint: ${var.lakebase_endpoint}
  ranker_endpoint: ${var.ranker_endpoint}
  rail_ranker_endpoint: ${var.rail_ranker_endpoint}
  retriever_endpoint: ${var.retriever_endpoint}
  feature_endpoint: ${var.feature_endpoint}
  agent_endpoint: ${var.agent_endpoint}
  llm_endpoint: ${var.llm_endpoint}
  warehouse_id: ${var.warehouse_id}
  volume: ${var.volume}
  end_date: ${var.end_date}

resources:
  jobs:
    crfs_preview_probe:
      name: crfs_preview_probe
      description: >-
        Report whether this workspace can run the advanced track: the
        databricks-feature-engineering floor and the Feature Views entity surface,
        whether a real feature computes, and whether a task can get a serverless GPU.
        Registers nothing and writes nothing.
      max_concurrent_runs: 1
      tags:
        demo: crunchyroll-feature-store
        layer: advanced
      # A task that sets `compute` must also name an environment:
      #   An environment is required for serverless task gpu_probe when `compute` is
      #   set on task level. Please define one using `environments` and environment_key.
      # `environment_version` supersedes the deprecated `client` field used by the
      # zerobus environment in resources/jobs.yml.
      environments:
        - environment_key: gpu
          spec:
            environment_version: "4"
            dependencies:
              - torch
      tasks:
        - task_key: feature_views_probe
          notebook_task:
            notebook_path: ../notebooks/30_advanced/29_preview_probe.py
            base_parameters: *common_params
          timeout_seconds: 1800

        # Task-level `compute` is how a *notebook* task gets an accelerator. The
        # accelerator is requested at task start, so an unavailable preview fails here
        # with a platform message rather than inside the notebook.
        - task_key: gpu_probe
          compute:
            hardware_accelerator: GPU_1xA10
          environment_key: gpu
          notebook_task:
            notebook_path: ../notebooks/30_advanced/29b_gpu_probe.py
            base_parameters: *common_params
          timeout_seconds: 2400

    crfs_feature_views:
      name: crfs_feature_views
      description: >-
        The declarative authoring path: seven viewer features defined as Feature Views
        over engagement_events, computed, registered in Unity Catalog, used to build a
        training set with no table name in it, logged into a model, scored in batch, and
        materialized to the online store the GA demo already owns.
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - ${var.notification_email}
      tags:
        demo: crunchyroll-feature-store
        layer: advanced
      tasks:
        - task_key: feature_views
          notebook_task:
            notebook_path: ../notebooks/30_advanced/30_feature_views.py
            base_parameters:
              <<: *common_params
              fv_prefix: fv_viewer
              fv_label_frac: "0.05"
              fv_materialize: "true"
          # Materialization stands up a pipeline and then waits for the first data to
          # land, which is minutes rather than seconds.
          timeout_seconds: 5400

    crfs_versioning:
      name: crfs_versioning
      description: >-
        Feature-definition versioning against the live endpoint: what the served model
        version pinned, a fingerprint so drift is detectable, the measured difference
        between a table change (pinned, safe) and an in-place function change (resolved
        per request, not safe), a canary traffic split, and which registered models pin
        which objects.
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - ${var.notification_email}
      tags:
        demo: crunchyroll-feature-store
        layer: advanced
      tasks:
        - task_key: versioning
          notebook_task:
            notebook_path: ../notebooks/30_advanced/31_feature_versioning.py
            base_parameters:
              <<: *common_params
              vers_model: crunchyroll_rail_ranker
              vers_viewer: v0001
              run_udf_experiment: "true"
              run_canary: "true"
              canary_percent: "10"
          # Two endpoint config updates, each of which has to build and bring up a
          # served entity. Measured in minutes, not seconds.
          timeout_seconds: 5400

    crfs_canary:
      name: crfs_canary
      description: >-
        Canary gate for the rail ranker: put a challenger (the GPU model's @challenger,
        else the champion's previous version) behind the live endpoint at a small share,
        score identical requests on both served entities, gate on error rate, p95 and
        ranking agreement, record PROMOTE/ROLLBACK in canary_decisions, and restore the
        champion unless apply=true and the gate passed.
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - ${var.notification_email}
      tags:
        demo: crunchyroll-feature-store
        layer: advanced
      tasks:
        - task_key: canary_gate
          notebook_task:
            notebook_path: ../notebooks/30_advanced/33_canary_gate.py
            base_parameters:
              <<: *common_params
              challenger_model: crunchyroll_rail_ranker_gpu
              challenger_alias: challenger
              canary_percent: "10"
              apply: "false"
          # Two config updates, one of which builds a served entity for a model this
          # endpoint has never served (torch, for the GPU challenger).
          timeout_seconds: 5400

    crfs_gpu_train:
      name: crfs_gpu_train
      description: >-
        Train the rail ranker as a torch MLP on serverless GPU, from the same
        point-in-time training set as the sklearn model, logged with the same feature
        spec so it is a drop-in for the same endpoint. This is the estimator
        substitution docs/open_items.md 4 names and leaves unproven.
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - ${var.notification_email}
      tags:
        demo: crunchyroll-feature-store
        layer: advanced
      environments:
        - environment_key: gpu
          spec:
            environment_version: "4"
            dependencies:
              - torch
              - databricks-feature-engineering
              - scipy
      tasks:
        - task_key: gpu_train
          compute:
            hardware_accelerator: GPU_1xA10
          environment_key: gpu
          notebook_task:
            notebook_path: ../notebooks/30_advanced/32_gpu_train.py
            base_parameters:
              <<: *common_params
              gpu_epochs: "8"
              gpu_batch_size: "4096"
              gpu_lr: "0.001"
              gpu_label_sample_frac: "0.25"
              gpu_use_distributed: "true"
              gpu_register: "true"
          # GPU minutes are billed and uncapped apart from this. The point-in-time join
          # dominates the wall time; the training itself is minutes on an A10.
          timeout_seconds: 7200
